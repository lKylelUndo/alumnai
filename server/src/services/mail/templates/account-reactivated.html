<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account Reactivated</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        color: #111;
        background: #f9fafb;
      }

      .container {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px;
        background: #ffffff;
        border-radius: 8px;
      }

      .badge {
        display: inline-block;
        padding: 6px 12px;
        background: #16a34a;
        color: #fff;
        border-radius: 999px;
        font-size: 12px;
        margin-bottom: 12px;
      }

      .muted {
        color: #6b7280;
        font-size: 12px;
      }

      .btn {
        display: inline-block;
        padding: 10px 16px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">Account Reactivated</div>

      <h2>Your Account Is Active Again</h2>

      <p>
        Your account suspension has been lifted by the Dean. You can now log
        in and use the system normally.
      </p>

      <p>
        <a class="btn" href="{{backToLoginURL}}" target="_blank" rel="noopener">
          Go to Login
        </a>
      </p>

      <p class="muted">
        If you did not expect this email, please contact support immediately.
      </p>
    </div>
  </body>
</html>
