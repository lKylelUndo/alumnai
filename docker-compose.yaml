services:
  nginx:
    image: nginx:alpine
    container_name: alumnai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - server
      - pgadmin
    networks:
      - alumnai-net

  certbot:
    image: certbot/certbot
    container_name: alumnai-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - alumnai-net

  postgres:
    image: postgres:16-alpine
    container_name: alumnai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alumnai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-alumnai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alumnai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alumnai-net

  redis:
    image: redis:7-alpine
    container_name: alumnai-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alumnai-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alumnai-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - alumnai-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: alumnai-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alumnai-net

volumes:
  certbot-etc:
  certbot-var:
  postgres-data:
  redis-data:
  pgadmin-data:

networks:
  alumnai-net:
